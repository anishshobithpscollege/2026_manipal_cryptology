name: Build assignments

on:
  push:
    branches: [main]
    paths:
      - "assignments/**"
      - "template/**"
      - "config.json"
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Typst image
        run: docker build -t typst-local .

      - name: Compile assignments
        run: |
          mkdir -p dist
          find assignments -type f -name main.typ | sort | while read -r f; do
            name=$(dirname "$f" | sed 's|^assignments/||; s|/|-|g')
            echo "::group::compile $name"
            docker run --rm -v "$PWD:/work" -w /work typst-local \
              compile --root /work "$f" "dist/${name}.pdf"
            echo "::endgroup::"
          done

      - name: Render preview images
        run: |
          mkdir -p dist/preview
          if [ -f assignments/theory/01-example/main.typ ]; then
            docker run --rm -v "$PWD:/work" -w /work typst-local \
              compile --format png --ppi 150 --root /work \
              assignments/theory/01-example/main.typ 'dist/preview/example-{p}.png'
          fi

      - name: Build preview collage
        run: |
          pip install --quiet pillow
          python scripts/make_collage.py --pages 2 1 6 --output dist/collage.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)." \
            dist/*.pdf dist/collage.png
